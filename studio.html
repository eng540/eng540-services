<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>

body {

  background:linear-gradient(135deg, #f5d066, #c59b27); color:#040d1a; border-color:#ffffff;

#stageArea {

#wrap {

  box-shadow: 0 0 80px rgba(0,0,0,.95);
  border: 1px solid rgba(212, 175, 82, 0.3);
}

  width: min(100vw, calc((100vh - 104px) * 0.5625));
  height: min(calc(100vw * 1.7778), calc(100vh - 104px));
}
body.mode-horizontal #wrap {
  width: min(100vw, calc((100vh - 104px) * 1.7778));
  height: min(calc(100vw * 0.5625), calc(100vh - 104px));
}
#masterCanvas { width:100%; height:100%; display:block; cursor:pointer; }
#dockedControls {

.ctrl-btn {

.ctrl-scrubber { width:140px; accent-color:#e2b84b; cursor:pointer; }

#stageArea { min-height:0; }

body { height:100vh; height:100dvh; }

.exp-sub { font-size:13px; font-weight:800; color:#cbd5e1; }

@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

let currentEpisodeIdx = 0;
let currentMs = 0, isPlaying = true, playbackSpeed = 1.0, lastTick = performance.now();
let sfxEnabled = true, voiceEnabled = false, lastSceneId = -1, audioCtx = null;
let mediaRecorder = null, recordedChunks = [], isRecording = false;

const canvas = document.getElementById('masterCanvas');
const ctx = canvas.getContext('2d');

const STARS = Array.from({ length: 65 }, (_, i) => ({
  x: (Math.sin(i * 45.23) * 0.5 + 0.5),
  y: (Math.cos(i * 91.17) * 0.5 + 0.5),
  r: 1.2 + (i % 3) * 0.9,
  spd: 0.015 + (i % 5) * 0.008,
  col: i % 2 === 0 ? '#f5d066' : '#28b894'
}));

function loadEpisode(idx) {
  currentEpisodeIdx = idx;
  currentMs = 0;
  lastSceneId = -1;
  document.querySelectorAll('.ep-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  renderFrame(0);
  updateUI();
  updateNow(); buildDots(); updateCaption();
  if (document.getElementById('exploreOverlay').open) renderExplore();
}

function playChime(freq = 587.33) {
  if (!sfxEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.25, now + 0.18);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.08, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.45);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.48);
  } catch (e) {}
}

function speakArabic(text) {
  if (!voiceEnabled || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-SA'; u.rate = 1.02;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function drawRoundedRect(ctx, x, y, w, h, r, fill, stroke, lineWidth = 2) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '', curY = y;
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
      ctx.fillText(line.trim(), x, curY);
      line = words[n] + ' '; curY += lineHeight;
    } else { line = testLine; }
  }
  ctx.fillText(line.trim(), x, curY);
  return curY + lineHeight;
}

function renderFrame(ms) {
  const isHoriz = document.body.classList.contains('mode-horizontal');
  const W = isHoriz ? 1920 : 1080, H = isHoriz ? 1080 : 1920;
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }

  const sec = ms / 1000;
  const ep = EPISODES[currentEpisodeIdx];
  const scene = ep.scenes.find(s => ms >= s.start && ms < s.end) || ep.scenes[0];
  const localMs = ms - scene.start;

  if (scene.id !== lastSceneId) {
    lastSceneId = scene.id;
    playChime(440 + scene.id * 60);
    speakArabic(scene.tts);
    updateNow(); updateCaption(); syncDots(); announceScene();
  }

  const grad = ctx.createRadialGradient(W * 0.5, H * 0.32, 50, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  grad.addColorStop(0, '#11324d'); grad.addColorStop(0.55, '#071626'); grad.addColorStop(1, '#030912');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(245, 208, 102, 0.04)'; ctx.lineWidth = 1;
  for (let gx = 0; gx < W; gx += 80) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
  for (let gy = 0; gy < H; gy += 80) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

  STARS.forEach(st => {
    const sx = (st.x * W + (REDUCED ? 0 : sec) * 25 * st.spd * 60) % W;
    const sy = ((st.y * H - (REDUCED ? 0 : sec) * 18 * st.spd * 60) % H + H) % H;
    ctx.fillStyle = st.col; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(sx, sy, st.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  const padX = isHoriz ? 70 : 48, topY = isHoriz ? 45 : 65;
  drawRoundedRect(ctx, W - padX - 310, topY, 310, 56, 28, 'rgba(14, 40, 60, 0.95)', '#d4af52', 2.5);
  ctx.fillStyle = '#ffffff'; ctx.font = '900 23px Cairo'; ctx.textAlign = 'center';
  ctx.fillText('إبداعات هندسية | ENG540', W - padX - 155, topY + 37);

  drawRoundedRect(ctx, padX, topY, 440, 56, 28, 'rgba(16, 52, 68, 0.95)', scene.themeColor, 2.5);
  ctx.fillStyle = scene.themeColor; ctx.font = '800 21px Cairo';
  ctx.fillText(scene.badge, padX + 220, topY + 37);

  ctx.fillStyle = '#ffffff'; ctx.font = isHoriz ? '900 42px Cairo' : '900 45px Cairo'; ctx.textAlign = 'center';
  let titleY = topY + (isHoriz ? 112 : 130);
  titleY = wrapText(ctx, scene.title, W / 2, titleY, W - padX * 2, isHoriz ? 58 : 64);

  ctx.fillStyle = '#ffe484'; ctx.font = isHoriz ? '700 24px Cairo' : '700 27px Cairo';
  titleY = wrapText(ctx, scene.subtitle, W / 2, titleY + 6, W - padX * 2, 42);

  const hubCx = isHoriz ? W * 0.25 : W * 0.5, hubCy = isHoriz ? H * 0.54 : titleY + 165, hubR = isHoriz ? 135 : 115;
  ctx.save(); ctx.translate(hubCx, hubCy);
  ctx.strokeStyle = 'rgba(40, 184, 148, 0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, hubR * 1.35, 0, Math.PI * 2); ctx.stroke();
  ctx.rotate(sec * 0.7); ctx.strokeStyle = scene.themeColor; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, hubR * 1.18, 0, 1.3); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, hubR * 1.18, Math.PI, Math.PI + 1.3); ctx.stroke();
  ctx.restore();

  drawRoundedRect(ctx, hubCx - hubR, hubCy - hubR * 0.62, hubR * 2, hubR * 1.24, 26, '#0a2236', '#f5d066', 3);
  ctx.fillStyle = '#f5d066'; ctx.font = '900 23px Cairo'; ctx.textAlign = 'center';
  ctx.fillText(ep.hubTitle, hubCx, hubCy - 8);
  ctx.fillStyle = '#ffffff'; ctx.font = '800 18px Cairo';
  ctx.fillText(ep.hubSub, hubCx, hubCy + 22);
  ctx.fillStyle = '#6ee7b7'; ctx.font = '700 15px Cairo';
  ctx.fillText(`المحطة ${scene.id + 1} من 4`, hubCx, hubCy + 50);

  const cards = scene.cards;
  const cardsStartX = isHoriz ? W * 0.46 : padX, cardsWidth = isHoriz ? W * 0.50 : W - padX * 2;
  let cardsStartY = isHoriz ? topY + 180 : hubCy + hubR + 45;
  const cardGap = isHoriz ? 20 : 24;
  const cardH = isHoriz ? 180 : 245;

  cards.forEach((c, idx) => {
    const cProg = Math.max(0, Math.min(1, (localMs - idx * 140) / 480));
    const cEase = REDUCED ? 1 : (1 - Math.pow(1 - cProg, 3));
    const cy = cardsStartY + idx * (cardH + cardGap) + (1 - cEase) * 45;
    ctx.globalAlpha = cEase;

    ctx.strokeStyle = c.col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hubCx, hubCy + (isHoriz ? 0 : hubR * 0.62)); ctx.lineTo(cardsStartX + cardsWidth * 0.5, cy); ctx.stroke();

    drawRoundedRect(ctx, cardsStartX, cy, cardsWidth, cardH, 24, 'rgba(9, 28, 46, 0.96)', c.col, 3);
    const badgeX = cardsStartX + cardsWidth - 52, badgeY = cy + 48;
    ctx.fillStyle = c.col; ctx.beginPath(); ctx.arc(badgeX, badgeY, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#040d1a'; ctx.font = '900 20px Cairo'; ctx.textAlign = 'center';
    ctx.fillText(c.num, badgeX, badgeY + 8);

    drawRoundedRect(ctx, cardsStartX + 24, cy + 20, 220, 42, 21, 'rgba(255,255,255,0.08)', c.col, 1.5);
    ctx.fillStyle = c.col; ctx.font = '800 17px Cairo';
    ctx.fillText(c.tag, cardsStartX + 134, cy + 48);

    ctx.fillStyle = '#ffffff'; ctx.font = '900 27px Cairo'; ctx.textAlign = 'right';
    ctx.fillText(c.title, badgeX - 48, cy + 54);

    ctx.fillStyle = '#e2e8f0'; ctx.font = '700 22px Cairo';
    wrapText(ctx, c.role, cardsStartX + cardsWidth - 32, cy + 108, cardsWidth - 64, 38);
    ctx.globalAlpha = 1;
  });

  const takeY = H - (isHoriz ? 168 : 225), takeH = isHoriz ? 86 : 118;
  drawRoundedRect(ctx, padX, takeY, W - padX * 2, takeH, 22, 'rgba(14, 42, 62, 0.98)', '#f5d066', 3);
  ctx.fillStyle = '#fef08a'; ctx.font = isHoriz ? '800 22px Cairo' : '800 24px Cairo'; ctx.textAlign = 'center';
  wrapText(ctx, scene.takeaway, W / 2, takeY + (isHoriz ? 38 : 45), W - padX * 2 - 48, 38);

  const footY = H - (isHoriz ? 68 : 88);
  drawRoundedRect(ctx, padX, footY, W - padX * 2, isHoriz ? 52 : 64, 16, 'rgba(5, 15, 26, 0.96)', 'rgba(212, 175, 82, 0.5)', 2);
  ctx.fillStyle = '#ffffff'; ctx.font = isHoriz ? '800 19px Cairo' : '800 21px Cairo'; ctx.textAlign = 'right';
  ctx.fillText('م. عبدالمجيد الفقيه | مهندس مدني — صناعة الأثر لا مجرد الإنجاز', W - padX - 24, footY + (isHoriz ? 33 : 40));
  ctx.fillStyle = '#f5d066'; ctx.textAlign = 'left';
  ctx.fillText('@ENG540 | 0532777678', padX + 24, footY + (isHoriz ? 33 : 40));

  ctx.fillStyle = '#28b894'; ctx.fillRect(0, H - 8, (ms / TOTAL_MS) * W, 8);
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function updateUI() {
  document.getElementById('scrubber').value = Math.floor(currentMs);
  document.getElementById('timeLabel').textContent = `${formatTime(currentMs)} / ${formatTime(TOTAL_MS)}`;
}
function togglePlay() {
  isPlaying = !isPlaying;
  const btn = document.getElementById('playPauseBtn');
  btn.textContent = isPlaying ? '⏸ إيقاف مؤقت' : '▶ تشغيل الفيديو';
  btn.classList.toggle('active', isPlaying);
  lastTick = performance.now();
}
function cycleSpeed() {
  const speeds = [1.0, 1.25, 1.5, 0.75];
  playbackSpeed = speeds[(speeds.indexOf(playbackSpeed) + 1) % speeds.length];
  document.getElementById('speedBtn').textContent = `⚡ السرعة: ${playbackSpeed}x`;
  prefs.speed = playbackSpeed; savePrefs();
}
function toggleLayoutMode() {
  document.body.classList.toggle('mode-horizontal');
  document.body.classList.toggle('mode-vertical');
  renderFrame(currentMs);
  prefs.layout = document.body.classList.contains('mode-horizontal') ? 'horizontal' : 'vertical';
  savePrefs(); fitStage();
}
function onScrub(val) {
  currentMs = Number(val);
  renderFrame(currentMs);
  updateUI();
  syncDots(); updateNow(); updateCaption();
  if (document.getElementById('exploreOverlay').open) renderExplore();
}
function toggleSfx() {
  sfxEnabled = !sfxEnabled;
  const btn = document.getElementById('sfxBtn');
  btn.classList.toggle('active', sfxEnabled);
  btn.textContent = sfxEnabled ? '🔔 نغمات الانتقال' : '🔕 صامت';
  prefs.sfx = sfxEnabled; savePrefs();
}
function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById('voiceBtn');
  btn.classList.toggle('active', voiceEnabled);
  btn.textContent = voiceEnabled ? '🔊 التعليق: مفعل' : '🔊 التعليق الصوتي';
  prefs.voice = voiceEnabled; savePrefs();
}
function toggleVideoRecording() {
  const btn = document.getElementById('recBtn');
  if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); return; }
  try {
    if (document.getElementById('exploreOverlay').open) closeExplore();
    const stream = canvas.captureStream(30);
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 6000000 });
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      isRecording = false;
      btn.textContent = '🎥 تصدير فيديو هذه الحلقة (WebM)';
      const url = URL.createObjectURL(new Blob(recordedChunks, { type: mimeType }));
      const a = document.createElement('a'); a.href = url;
      a.download = EPISODES[currentEpisodeIdx].name + '.webm';
      a.click();
    };
    currentMs = 0; isPlaying = true; isRecording = true;
    btn.textContent = '⏹ جارٍ تسجيل الحلقة.. اضغط للحفظ الآن';
    mediaRecorder.start(200);
  } catch (err) { btn.textContent = '⚠️ المتصفح لا يدعم التسجيل المباشر'; }
}
function loop(now) {
  if (isPlaying) {
    currentMs += (now - lastTick) * playbackSpeed;
    if (currentMs >= TOTAL_MS) {
      if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      currentMs = currentMs % TOTAL_MS;
    }
    renderFrame(currentMs); updateUI();
  }
  lastTick = now; requestAnimationFrame(loop);
}

};

const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const PREFS_KEY = 'eng540-studio-prefs';
let prefs = {};
try { prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch (e) { prefs = {}; }
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} }

let exploreOpen = false, wasPlayingBeforeExplore = false;

function currentScene() {
  const ep = EPISODES[currentEpisodeIdx];
  return ep.scenes.find(s => currentMs >= s.start && currentMs < s.end) || ep.scenes[0];
}
function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function announceScene() {
  const sc = currentScene();
  document.getElementById('srLive').textContent = 'المحطة ' + (sc.id + 1) + ' من 4: ' + sc.title;
}
function updateNow() {
  const ep = EPISODES[currentEpisodeIdx], sc = currentScene();
  document.getElementById('nowEp').textContent = 'الحلقة ' + (currentEpisodeIdx + 1) + ': ' + ep.hubTitle + ' (' + ep.hubSub + ')';
  document.getElementById('nowSc').textContent = 'المحطة ' + (sc.id + 1) + ' من 4: ' + sc.title;
}

/* ── التنقل بين المحطات ── */
function jumpScene(dir) {
  const ep = EPISODES[currentEpisodeIdx];
  const sc = currentScene();
  const idx = sc.id + dir;
  if (idx >= 0 && idx < ep.scenes.length) {
    currentMs = ep.scenes[idx].start + 1;
    lastSceneId = -1;
    renderFrame(currentMs); updateUI(); syncDots();
  } else if (dir > 0 && currentEpisodeIdx < EPISODES.length - 1) {
    loadEpisode(currentEpisodeIdx + 1); // نهاية الحلقة → الحلقة التالية
  } else if (dir < 0 && currentEpisodeIdx > 0) {
    loadEpisode(currentEpisodeIdx - 1); // بداية الحلقة → الحلقة السابقة
  }
  announceScene();
}
function buildDots() {
  const ep = EPISODES[currentEpisodeIdx];
  const box = document.getElementById('sceneDots');
  box.innerHTML = ep.scenes.map((sc, i) =>
    '<button type="button" class="sd-btn" data-i="' + i + '" aria-label="الانتقال إلى المحطة ' + (i + 1) + ' من 4: ' + esc(sc.title) + '">المحطة ' + (i + 1) + '</button>'
  ).join('');
  box.querySelectorAll('.sd-btn').forEach(b => {
    b.addEventListener('click', () => {
      currentMs = EPISODES[currentEpisodeIdx].scenes[Number(b.dataset.i)].start + 1;
      lastSceneId = -1;
      renderFrame(currentMs); updateUI(); syncDots(); announceScene();
      if (exploreOpen) renderExplore();
    });
  });
  syncDots();
}
function syncDots() {
  const sc = currentScene();
  document.querySelectorAll('#sceneDots .sd-btn').forEach((b, i) => b.classList.toggle('active', i === sc.id));
}

/* ── نص المشهد (التعليق النصي الكامل) ── */
function toggleCaptions(force) {
  const bar = document.getElementById('captionBar');
  const on = (typeof force === 'boolean') ? force : !bar.classList.contains('show');
  bar.classList.toggle('show', on);
  document.getElementById('capBtn').classList.toggle('active', on);
  document.getElementById('capBtn').setAttribute('aria-pressed', String(on));
  prefs.captions = on; savePrefs();
  if (on) updateCaption();
  fitStage();
}
function updateCaption() {
  if (!document.getElementById('captionBar').classList.contains('show')) return;
  document.getElementById('capText').textContent = currentScene().tts;
}

/* ── وضع الاستكشاف: حوار غير نمطي، مصدره الوحيد بيانات EPISODES ── */
function renderExplore() {
  const ep = EPISODES[currentEpisodeIdx], sc = currentScene();
  const ei = currentEpisodeIdx;
  const cards = sc.cards.map((c, ci) => {
    const link = EP_LINKS[ei + '-' + sc.id + '-' + ci];
    return '<article class="exp-card">' +
      '<div class="exp-card-top"><span class="exp-num" style="background:' + c.col + '">' + esc(c.num) + '</span>' +
      '<span class="exp-tag" style="color:' + c.col + '">' + esc(c.tag) + '</span></div>' +
      '<h3>' + esc(c.num) + ' — ' + esc(c.title) + '</h3>' +
      '<p class="exp-role">' + esc(c.role) + '</p>' +
      (link ? '<a class="exp-link" href="' + ENC_BASE + link + '" target="_blank" rel="noopener">📘 الصفحة المرتبطة في موسوعة ENG540 ↗</a>' : '') +
      '</article>';
  }).join('');
  document.getElementById('exploreOverlay').innerHTML =
    '<div class="exp-head">' +
      '<div><h2 id="expTitle" class="exp-title">🔍 استكشاف المحطة ' + (sc.id + 1) + ' من 4: ' + esc(sc.title) + '</h2>' +
      '<div class="exp-sub">الحلقة ' + (ei + 1) + ': ' + esc(ep.hubTitle) + ' (' + esc(ep.hubSub) + ') — ' + esc(sc.subtitle) + '</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="exp-nav" onclick="expScene(-1)">المحطة السابقة</button>' +
        '<button type="button" class="exp-nav" onclick="expScene(1)">المحطة التالية</button>' +
        '<button type="button" class="exp-close" onclick="closeExplore()" autofocus>✕ عودة إلى العرض</button>' +
      '</div></div>' +
    cards +
    '<p class="exp-note">نصوص هذه البطاقات من بيانات الحلقة نفسها التي يرسمها العرض السينمائي — قابلة للتحديد والنسخ.</p>';
}
function toggleExplore() {
  const d = document.getElementById('exploreOverlay');
  if (d.open) { d.close(); return; }
  exploreOpen = true;
  wasPlayingBeforeExplore = isPlaying;
  if (isPlaying) togglePlay();               // إيقاف مؤقت حفظاً لموضع التشغيل
  renderExplore();
  d.show();                                   // غير نمطي: أدوات التحكم تبقى فعّالة
  document.getElementById('exploreBtn').setAttribute('aria-expanded', 'true');
  announceScene();
}
function closeExplore() {
  const d = document.getElementById('exploreOverlay');
  if (d.open) d.close();
}
function expScene(dir) {
  jumpScene(dir);
  renderExplore();
  syncDots();
}
document.getElementById('exploreOverlay').addEventListener('close', () => {
  exploreOpen = false;
  document.getElementById('exploreBtn').setAttribute('aria-expanded', 'false');
  if (wasPlayingBeforeExplore && !isPlaying) togglePlay(); // استئناف من الموضع نفسه
});

/* ── ملاءمة المسرح مع أي ارتفاع لأشرطة الواجهة ── */
function fitStage() {
  const isHoriz = document.body.classList.contains('mode-horizontal');
  const ar = isHoriz ? 16 / 9 : 9 / 16;
  const box = document.getElementById('stageArea');
  const aw = box.clientWidth - 8, ah = box.clientHeight - 8;
  if (aw <= 0 || ah <= 0) return;
  let w = Math.min(aw, ah * ar), h = w / ar;
  if (h > ah) { h = ah; w = h * ar; }
  const wrap = document.getElementById('wrap');
  wrap.style.width = Math.floor(w) + 'px';
  wrap.style.height = Math.floor(h) + 'px';
}

/* ── إتاحة لوحة المفاتيح ── */
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const d = document.getElementById('exploreOverlay');
  if (d.open) { if (e.key === 'Escape') d.close(); return; }
  if (e.key === ' ' || e.key === 'Spacebar') { togglePlay(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { jumpScene(1); e.preventDefault(); }   // RTL: يسار = تقدم
  else if (e.key === 'ArrowRight') { jumpScene(-1); e.preventDefault(); } // يمين = رجوع
  else if (e.key === 'e' || e.key === 'E' || e.key === 'ة') { toggleExplore(); e.preventDefault(); }
  else if (/^[1-5]$/.test(e.key)) { loadEpisode(Number(e.key) - 1); announceScene(); }
});

/* ── نقر المسرح = إيقاف/تشغيل · سحب أفقي = تبديل الحلقة ── */
canvas.addEventListener('click', () => { if (!document.getElementById('exploreOverlay').open) togglePlay(); });
let touchX = 0, touchY = 0;
canvas.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; touchX = t.clientX; touchY = t.clientY; }, { passive: true });
canvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchX, dy = t.clientY - touchY;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 42) {
    const next = (currentEpisodeIdx + (dx < 0 ? 1 : EPISODES.length - 1)) % EPISODES.length;
    loadEpisode(next); announceScene();
  }
}, { passive: true });

/* ── إيقاف التشغيل عند إخفاء الصفحة ── */
document.addEventListener('visibilitychange', () => { if (document.hidden && isPlaying) togglePlay(); });

/* ── نقل أدوات التحكم الثانوية إلى قائمة «المزيد» على الشاشات الضيقة ── */
const mqControls = window.matchMedia('(max-width: 720px)');
function relayoutControls() {
  const secondary = document.getElementById('secondaryCtrls');
  const menu = document.getElementById('moreMenu');
  const bar = document.getElementById('dockedControls');
  const moreBtn = document.getElementById('moreBtn');
  if (mqControls.matches) {
    if (!menu.contains(secondary)) menu.appendChild(secondary);
    if (typeof menu.showPopover !== 'function') {
      moreBtn.onclick = () => menu.classList.toggle('force-open');
    }
  } else {
    if (!bar.contains(secondary)) bar.insertBefore(secondary, moreBtn);
    menu.classList.remove('force-open');
  }
}
if (mqControls.addEventListener) mqControls.addEventListener('change', relayoutControls);
else if (mqControls.addListener) mqControls.addListener(relayoutControls);

/* ── تطبيق التفضيلات المحفوظة ── */
function applyPrefs() {
  try {
    if (prefs.layout === 'horizontal' && !document.body.classList.contains('mode-horizontal')) {
      document.body.classList.toggle('mode-horizontal');
      document.body.classList.toggle('mode-vertical');
    }
    if (typeof prefs.speed === 'number') {
      playbackSpeed = prefs.speed;
      document.getElementById('speedBtn').textContent = `⚡ السرعة: ${playbackSpeed}x`;
    }
    if (prefs.sfx === false) toggleSfx();
    if (prefs.voice === true) toggleVoice();
    if (prefs.captions === true) toggleCaptions(true);
  } catch (e) {}
}

/* ═══ نهاية تطويرات v3.1 ═══ */

window.addEventListener('load', () => {
  applyPrefs();
  buildDots();
  updateNow();
  relayoutControls();
  fitStage();
  window.addEventListener('resize', fitStage);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { fitStage(); renderFrame(0); lastTick = performance.now(); requestAnimationFrame(loop); });
  } else { renderFrame(0); requestAnimationFrame(loop); }
});
</script>
